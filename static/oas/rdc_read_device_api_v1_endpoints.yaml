openapi: "3.0.0"
info:
  version: "1.0.0"
  title: "Real Devices API Reference"
  x-last-modified: "2026-11-26"
  x-beta: false
  description: |
    The Real Devices API gives you programmatic access to the real iOS and Android devices in the Sauce Labs cloud and
    to the tests that run on them. Use it to:

    - **Real Devices** — look up the devices in a data center, their specifications and whether they are free right now.
    - **Jobs** — list your real device tests, read one test's details, download its video, logs and other results,
      start an Espresso, XCUITest or XCTest run, stop a running test, rename or tag a test, or delete it.
    - **Private Real Device Management** — for organization admins: list your private devices, assign them to teams
      and set which apps, accounts and files persist on them between sessions.

    **Authentication and regions**

    Every request uses HTTP Basic Authentication with your Sauce Labs username and access key (find both under
    **Account > User Settings** in the Sauce Labs UI). Call the API of the data center your devices and tests are in:
    `api.us-west-1.saucelabs.com` (US West), `api.eu-central-1.saucelabs.com` (EU Central),
    `api.us-east-4.saucelabs.com` (US East) or `api.asia-south-2.saucelabs.com` (Asia South). A test exists only in the
    data center it ran in. See
    [Getting Started](https://docs.saucelabs.com/dev/api/) for details on authentication and servers.

    **Ids you will meet**

    - A **device id** (also called device descriptor) names a device model and OS version, for example
      `Samsung_Galaxy_S24_real`. Several physical devices can share one id. Get Devices lists them.
    - A **job id** (also called test id or test report id) is a 32-character hexadecimal string that identifies one
      test run, for example `0123456789abcdef0123456789abcdef`. It is the last part of a test's URL in the Sauce Labs
      UI (`https://app.saucelabs.com/tests/<job id>`).

    **Errors**

    Failed requests return the HTTP status codes listed with each endpoint. Wrong or missing credentials return `401`
    with `{"detail": "Authorization failed"}`. Most other errors return a JSON body with a `code` and a `message`
    that says what to fix; a few validation errors use the `application/problem+json` format with a `title` and
    `detail`. Each endpoint documents the exact bodies it returns.

servers:
  - url: https://api.us-west-1.saucelabs.com
    description: US West
  - url: https://api.eu-central-1.saucelabs.com
    description: EU Central
  - url: https://api.us-east-4.saucelabs.com
    description: US East
  - url: https://api.asia-south-2.saucelabs.com
    description: Asia South
security:
  - basicAuth: []

tags:
  - name: Real Devices
    description: Look up the real devices available to your account in a data center, their specifications and their current state.
  - name: Jobs
    description: List, inspect, start, stop, update and delete tests on real devices, and download their results.
  - name: Private Real Device Management
    description: |
      Manage the private devices of your organization. These endpoints are available to organization admins only;
      other users get `403`. Learn more about [managing your private devices](https://docs.saucelabs.com/basics/acct-team-mgmt/private-device-mgmt/).

paths:
  /v1/rdc/devices:
    get:
      operationId: getDevices
      summary: Get Devices
      description: |
        Returns every real device model you can test on in this data center — the public devices of the cloud plus the
        private devices of your organization — with its specifications and capabilities. Each entry describes one
        device model and OS version (one device id), not one physical device; several identical devices behind an id
        are listed once.

        Use this list to find the device id for an exact device, to check an OS version or screen size, and to see
        whether a model supports what your test needs (`supportsXcuiTest`, `supportsMockLocations`, …). It does not
        tell you whether a device is free right now: use [Get Devices Status](#tag/Real-Devices/operation/getDevicesStatus)
        for that.
      tags:
        - "Real Devices"
      parameters:
        - name: deviceId
          in: query
          required: false
          description: |
            Return only the devices whose id is exactly this value, or whose display name matches this regular
            expression as a whole (`Samsung Galaxy S2[0-9].*`, `iPhone 1[5-6].*`). Leave it out to get all devices.
          schema:
            type: string
          example: "Samsung Galaxy S2[0-9].*"
      responses:
        "200":
          description: The list of devices. Empty when nothing matches `deviceId`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceDescriptor"
              examples:
                devices:
                  summary: One Android phone and one iPad
                  value:
                    - abiType: "arm64-v8a"
                      apiLevel: 34
                      cpuCores: 8
                      cpuFrequency: 3300
                      cpuType: "ARM"
                      defaultOrientation: "PORTRAIT"
                      deviceFamily: "ANY"
                      dpi: 500
                      dpiName: "xxhdpi"
                      hasOnScreenButtons: true
                      id: "Samsung_Galaxy_S24_real"
                      internalOrientation: "PORTRAIT"
                      internalStorageSize: 131072
                      isAlternativeIoEnabled: true
                      isArm: true
                      isKeyGuardDisabled: false
                      isPrivate: false
                      isRooted: false
                      isTablet: false
                      manufacturer: ["Samsung"]
                      modelNumber: "SM-S921B"
                      name: "Samsung Galaxy S24"
                      os: "ANDROID"
                      osVersion: "14"
                      pixelsPerPoint: 1
                      ramSize: 8192
                      resolutionHeight: 2340
                      resolutionWidth: 1080
                      screenSize: 6.2
                      sdCardSize: 0
                      supportsAppiumWebAppTesting: true
                      supportsGlobalProxy: false
                      supportsManualWebTesting: true
                      supportsMinicapSocketConnection: false
                      supportsMockLocations: true
                      supportsMultiTouch: true
                      supportsXcuiTest: true
                    - abiType: "arm64"
                      apiLevel: 0
                      cpuCores: 8
                      cpuFrequency: 3700
                      cpuType: "ARM"
                      defaultOrientation: "LANDSCAPE"
                      deviceFamily: "IPAD"
                      dpi: 264
                      dpiName: "hdpi"
                      hasOnScreenButtons: true
                      id: "iPad_Pro_11_2024_real"
                      internalOrientation: "LANDSCAPE"
                      internalStorageSize: 262144
                      isAlternativeIoEnabled: true
                      isArm: true
                      isKeyGuardDisabled: false
                      isPrivate: false
                      isRooted: false
                      isTablet: true
                      manufacturer: ["Apple"]
                      modelNumber: "iPad16,3"
                      name: "iPad Pro 11 2024"
                      os: "IOS"
                      osVersion: "18.0"
                      pixelsPerPoint: 2
                      ramSize: 8192
                      resolutionHeight: 2420
                      resolutionWidth: 1668
                      screenSize: 11.0
                      sdCardSize: 0
                      supportsAppiumWebAppTesting: true
                      supportsGlobalProxy: false
                      supportsManualWebTesting: true
                      supportsMinicapSocketConnection: true
                      supportsMockLocations: true
                      supportsMultiTouch: true
                      supportsXcuiTest: true
        "401":
          $ref: "#/components/responses/NotAuthorized"

  /v1/rdc/devices/{device_id}:
    get:
      operationId: getDevice
      summary: Get a Specific Device
      description: |
        Returns the specifications and capabilities of one device model, by its device id. The device id is the `id`
        field of [Get Devices](#tag/Real-Devices/operation/getDevices) and the `device_descriptor.id` of a job.
      tags:
        - "Real Devices"
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDescriptor"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          description: Not Found. No device with this id is available to your account in this data center. The body is the plain text `DEVICE_DESCRIPTOR_NOT_FOUND`.
          content:
            text/plain:
              schema:
                type: string
                enum: ["DEVICE_DESCRIPTOR_NOT_FOUND"]
              example: "DEVICE_DESCRIPTOR_NOT_FOUND"

  /v1/rdc/devices/available:
    get:
      operationId: getAvailableDevices
      summary: Get Available Devices
      deprecated: true
      description: |
        Returns the ids of the device models that have at least one device free for testing right now.

        **Deprecated.** Use [Get Devices Status](#tag/Real-Devices/operation/getDevicesStatus) instead: it returns the
        same information as `state: "AVAILABLE"` and adds the devices that are busy, cleaning or offline.
      tags:
        - "Real Devices"
      responses:
        "200":
          description: The ids of the device models with a free device.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  description: A device id.
              example:
                - "Samsung_Galaxy_S24_real"
                - "iPhone_16_real"
                - "iPad_Pro_11_2024_real"
                - "Google_Pixel_9_real"
        "401":
          $ref: "#/components/responses/NotAuthorized"

  /v1/rdc/devices/status:
    get:
      operationId: getDevicesStatus
      summary: Get Devices Status
      description: |
        Returns every device model you can test on with its current state — free, in use, or (private devices only)
        cleaning, rebooting, in maintenance or offline — and whether it is a private device of your organization.
        Call it before starting a test to pick a device that is free, or to see what your team is using.

        A device model with several physical devices behind it gets one entry: it is `AVAILABLE` when at least one of
        them is free, otherwise `IN_USE` when they are in different busy states.

        | `state` | Meaning |
        |---|---|
        | `AVAILABLE` | At least one device of this model is free and can be allocated to a test. |
        | `IN_USE` | Every device of this model is running a test or a Live Testing session. |
        | `CLEANING` | The device is being reset after a session (private devices only). |
        | `REBOOTING` | The device is rebooting (private devices only). |
        | `MAINTENANCE` | The device is being checked by Sauce Labs or has a low battery (private devices only). |
        | `OFFLINE` | The device is not connected (private devices only). |

        **Who is using a private device.** For a private device that is `IN_USE`, `inUseBy` holds the username of the
        person using it — if you are allowed to see it: you are an organization admin, cross-team job sharing is
        enabled for your organization, you are on the same team as that person, or it is you. Otherwise, and for
        every public device, `inUseBy` is an empty list.
      tags:
        - "Real Devices"
      parameters:
        - name: state
          in: query
          required: false
          description: |
            Return only devices in these states. Repeat the parameter for several states
            (`?state=AVAILABLE&state=IN_USE`). Values are matched regardless of case. A value that is not one of the
            six states returns `400`.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DeviceState"
          example: ["AVAILABLE"]
        - name: privateOnly
          in: query
          required: false
          description: "`true` returns only the private devices of your organization."
          schema:
            type: boolean
            default: false
        - name: deviceName
          in: query
          required: false
          description: |
            Return only the devices whose id is exactly this value, or whose display name matches this regular
            expression as a whole (`Samsung Galaxy S2[0-9].*`, `iPhone 1[5-6].*`).
          schema:
            type: string
          example: "iPhone 1[5-6].*"
      responses:
        "200":
          description: The devices and their states.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesStatusResponse"
              examples:
                mixed:
                  summary: Public and private devices in different states
                  value:
                    devices:
                      - descriptor: "Samsung_Galaxy_S24_real"
                        state: "AVAILABLE"
                        inUseBy: []
                        isPrivateDevice: false
                      - descriptor: "iPhone_16_real"
                        state: "IN_USE"
                        inUseBy: []
                        isPrivateDevice: false
                      - descriptor: "iPhone_15_Pro_private"
                        state: "IN_USE"
                        inUseBy:
                          - username: "teammate-username"
                        isPrivateDevice: true
                      - descriptor: "Google_Pixel_9_private"
                        state: "CLEANING"
                        inUseBy: []
                        isPrivateDevice: true
        "400":
          description: Bad Request. A `state` value is not one of the six states.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Invalid device state."
                detail: "The query parameter 'state' has an invalid value: 'busy'. Allowed values are: IN_USE, AVAILABLE, REBOOTING, CLEANING, MAINTENANCE, OFFLINE."
        "401":
          $ref: "#/components/responses/NotAuthorized"

  /v1/rdc/jobs:
    get:
      operationId: getJobs
      summary: Get Real Device Jobs
      description: |
        Returns your organization's real device tests of the last 60 days, newest first, one page at a time. Each entry
        is a summary; use [Get a Specific Real Device Job](#tag/Jobs/operation/getJob) with the `id` for the full
        details and the links to the video and logs.

        **Which tests you see.** Tests of your own team. Organization admins, and every user of an organization with
        cross-team job sharing enabled, see the tests of all teams and can narrow them with `team_id`.

        **Which test types.** Without `type`, the list holds the automated tests: Appium, Espresso, XCUITest (XCTest
        runs are listed as XCUITest) and Real Device Access API sessions. Pass `type` to pick other types, for example
        `type=LIVE` for Live Testing sessions.

        **Paging.** `limit` sets the page size and `offset` the 1-based position of the first entry. The response's
        `metaData.moreAvailable` tells you whether another page follows: request it with
        `offset = offset + limit`.
      tags:
        - "Jobs"
      parameters:
        - name: limit
          in: query
          required: false
          description: "The number of tests per page, from 1 to 1000. A larger value is reduced to 1000; a value below 1 returns `400`."
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
          example: 20
        - name: offset
          in: query
          required: false
          description: "The 1-based position of the first test to return. `0` is treated as `1`; a negative value returns `400`."
          schema:
            type: integer
            minimum: 0
            default: 1
          example: 1
        - name: type
          in: query
          required: false
          description: |
            Return only tests of these types. Repeat the parameter for several types (`?type=ESPRESSO&type=XCUITEST`).
            Values must be upper case exactly as listed; any other value returns `404` with an empty body. Without
            `type`, the list holds `APPIUM`, `ESPRESSO`, `XCUITEST` and `API` tests.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [APPIUM, ESPRESSO, XCUITEST, LIVE, VIRTUAL_USB, API]
          example: ["ESPRESSO"]
        - name: status
          in: query
          required: false
          description: |
            Return only tests with these statuses (see the `status` field of a test). Repeat the parameter for several
            statuses; a value that is not a status is ignored. `in progress` must be URL-encoded (`in%20progress`).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/JobStatus"
          example: ["failed", "error"]
        - name: owner
          in: query
          required: false
          description: "Return only the tests started by this Sauce Labs username."
          schema:
            type: string
          example: "your-username"
        - name: team_id
          in: query
          required: false
          description: "Return only the tests of this team, by team id. Honoured for organization admins and in organizations with cross-team job sharing; other users always get their own team's tests."
          schema:
            type: string
          example: "8f0444d7762548bd81ae46722a14e1c6"
      responses:
        "200":
          description: One page of tests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
              examples:
                page:
                  summary: Two tests, one Espresso and one Appium
                  value:
                    entities:
                      - assigned_tunnel_id: null
                        device_type: "real_device"
                        test_report_type: "ANDROID_INSTRUMENTATION"
                        owner_sauce: "your-username"
                        consolidated_status: "passed"
                        end_time: 1764160859000
                        id: "0123456789abcdef0123456789abcdef"
                        name: "Checkout flow — release 4.2"
                        os: "Android"
                        os_version: "14"
                        device_name: "Samsung Galaxy S24"
                        start_time: 1764160800000
                        status: "passed"
                        creation_time: 1764160800000
                        automation_backend: "ESPRESSO"
                        manual: false
                        has_crashed: false
                      - assigned_tunnel_id: null
                        device_type: "real_device"
                        test_report_type: "APPIUM"
                        owner_sauce: "teammate-username"
                        consolidated_status: "failed"
                        end_time: 1764157320000
                        id: "fedcba9876543210fedcba9876543210"
                        name: "Login with wrong password"
                        os: "iOS"
                        os_version: "18.0"
                        device_name: "iPhone 16"
                        start_time: 1764157200000
                        status: "failed"
                        creation_time: 1764157200000
                        automation_backend: "APPIUM"
                        manual: false
                        has_crashed: false
                    metaData:
                      moreAvailable: true
                      offset: 1
                      limit: 2
                      sortDirection: "DESCENDING"
        "400":
          description: Bad Request. `limit` is below 1 or `offset` is negative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                limit:
                  value:
                    code: "INVALID_REQUEST_PAYLOAD"
                    message: "limit must be >= 1"
                offset:
                  value:
                    code: "INVALID_REQUEST_PAYLOAD"
                    message: "offset must be >= 0"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          description: Not Found, with an empty body. A query parameter has a value of the wrong kind, for example a `type` that is not one of the listed values or a `limit` that is not a number.

  /v1/rdc/jobs/{job_id}:
    get:
      operationId: getJob
      summary: Get a Specific Real Device Job
      description: |
        Returns everything about one test: its status and result, the device it ran on, the app under test, when it
        was created, started and finished, and the links to download its video, logs, screenshots and other results.

        **Following a running test.** `status` is `in progress` while the test runs and becomes `passed`, `failed`,
        `error` or `complete` when it ends; `passed` is `null` until there is a result. Poll this endpoint until the
        status changes, then download the results from the `*_url` links.

        **Links.** A `*_url` field is `null` when the test has no such result: Appium tests have `framework_log_url`
        (the Appium log) and `requests_url`; Espresso and XCUITest tests have `test_cases_url` and `junit_log_url`;
        `network_log_url`, `testfairy_log_url` (device vitals) and `crash_log_url` are set only when the feature was
        on for the test. All links are [asset downloads](#tag/Jobs/operation/getJobAsset) of this test.
      tags:
        - "Jobs"
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The test.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                espresso:
                  $ref: "#/components/examples/EspressoJob"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/JobForbidden"
        "404":
          $ref: "#/components/responses/JobNotFound"
    put:
      operationId: updateJob
      summary: Update a Job
      description: |
        Changes the name, build, tags or pass/fail result of a test, at any time — also while it is running. Only the
        fields you send are changed; a field you leave out keeps its value. A field you send replaces the old value
        entirely: to add a tag, send the whole list of tags you want.

        The response is the updated test, in the same shape as [Get a Specific Real Device Job](#tag/Jobs/operation/getJob).
      tags:
        - "Jobs"
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdateRequest"
            examples:
              rename:
                summary: Rename the test, assign it to a build and tag it
                value:
                  name: "Checkout flow — release 4.2"
                  build: "release-4.2.0"
                  tags: ["smoke", "checkout"]
              markFailed:
                summary: Mark the test as failed
                value:
                  passed: false
      responses:
        "200":
          description: The updated test.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                updated:
                  $ref: "#/components/examples/EspressoJob"
        "400":
          description: Bad Request. A field has an invalid value; nothing was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                name:
                  summary: name is blank, longer than 255 characters or contains emojis
                  value:
                    code: "INVALID_REQUEST_PAYLOAD"
                    message: "Test Report Name must be less than 255 characters and must not include emojis"
                build:
                  summary: build contains spaces or other characters that are not letters, digits or punctuation
                  value:
                    code: "INVALID_REQUEST_PAYLOAD"
                    message: "Test Report Build ID must be less than 255 characters, only latin chars, numbers, punctuations are accepted"
                tags:
                  summary: more than 10 tags, or a tag with spaces or other characters that are not letters, digits or punctuation
                  value:
                    code: "INVALID_REQUEST_PAYLOAD"
                    message: "Test Report Tags must be less than 30 characters, only latin chars, numbers, punctuations are accepted, maximum number of tags is 10"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/JobForbidden"
        "404":
          $ref: "#/components/responses/JobNotFound"
        "500":
          description: Internal Server Error. The body could not be read — it is not valid JSON, it is empty, or `passed` is not a boolean. Fix the body and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
    delete:
      operationId: deleteJob
      summary: Delete a Job
      description: |
        Deletes a test and all of its results — video, screenshots, logs — from your test history. This cannot be
        undone.

        Only the user who started the test, an admin of that user's team, or an organization admin can delete it.
      tags:
        - "Jobs"
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The test was deleted. The body is empty.
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          description: Forbidden. You are neither the owner of the test, nor an admin of its team, nor an organization admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: "FORBIDDEN"
                message: "Only team/org administrators and job owners can delete test results"
        "404":
          $ref: "#/components/responses/JobNotFound"

  /v1/rdc/jobs/{job_id}/{asset}:
    get:
      operationId: getJobAsset
      summary: Download a Specific Real Device Job's Asset
      description: |
        Downloads one result file of a test: the video, the device log, the framework log, the list of test cases,
        screenshots, the network capture and so on. Which files exist depends on the test framework and on the
        features that were on during the test; a test's `*_url` fields point at the files it has.

        | Asset | `asset` path | Test types | Needs |
        |---|---|---|---|
        | Device log | `deviceLogs` | all | — |
        | Appium log | `appiumLogs` | Appium, Access API (when Appium logs were requested) | — |
        | Appium requests | `appiumRequests` | Appium | — |
        | WebDriverAgent log | `wdaLogs` | Appium on iOS | — |
        | XCUITest log | `xcuitestLogs` | XCUITest, XCTest | — |
        | Test cases | `testCases` | Espresso, XCUITest, XCTest | — |
        | JUnit report | `junit.xml` | Espresso, XCUITest, XCTest (finished tests only) | — |
        | Video | `video.mp4` | all | — |
        | Screenshots | `screenshots.zip` | tests that took screenshots | [Espresso screenshot capture](https://docs.saucelabs.com/mobile-apps/automated-testing/espresso-xcuitest/espresso-capture/) for Espresso |
        | Network capture | `network.har` | all | [Network capture](https://docs.saucelabs.com/mobile-apps/features/network-capture/) |
        | Device vitals | `insights.json` | all | [Device vitals](https://docs.saucelabs.com/mobile-apps/features/mobile-app-diagnostics/device-vitals/) |
        | Crash report | `crash.json` | Appium | [Crash and error reporting](https://docs.saucelabs.com/mobile-apps/features/mobile-app-diagnostics/crash-error-reporting/) |
        | Device events | `deviceEvents.json` | Appium | — |

        For tests started through the [Real Device Access API](https://docs.saucelabs.com/mobile-apps/real-device-access-api/real-device-access-api-introduction/),
        the files depend on the artifact toggles you chose when starting the session; see
        [Test Results for the Access API](https://docs.saucelabs.com/mobile-apps/real-device-access-api/real-device-access-api-test-results/).

        **Good to know**

        - The logs (`deviceLogs`, `appiumLogs`, `xcuitestLogs`, `wdaLogs`) are returned as plain text, one line per
          entry. Send `Accept: application/json` to get them as a JSON array of entries instead. A log the test does
          not have comes back as `200` with an empty body.
        - Every file is sent as an attachment (`Content-Disposition: attachment; filename=…`). Send
          `Accept-Encoding: gzip` to receive it compressed.
        - `video.mp4` supports HTTP range requests (`Range: bytes=…`), so players can seek; a range request is answered
          with `206`.
        - A single screenshot is available at `/v1/rdc/jobs/{job_id}/screenshots/{screenshot_id}` as a PNG; the test's
          `screenshots` field lists these links.
      tags:
        - "Jobs"
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: asset
          in: path
          required: true
          description: "The file to download, from the table above."
          schema:
            type: string
            enum:
              - deviceLogs
              - appiumLogs
              - appiumRequests
              - wdaLogs
              - xcuitestLogs
              - testCases
              - junit.xml
              - video.mp4
              - screenshots.zip
              - network.har
              - insights.json
              - crash.json
              - deviceEvents.json
          example: "deviceLogs"
        - name: download
          in: query
          required: false
          description: "Any value (for example `true`) returns a log as plain text even when the request asks for `application/json`. Has no effect on other assets."
          schema:
            type: boolean
          example: true
      responses:
        "200":
          description: The file. The media type depends on the asset.
          content:
            text/plain:
              schema:
                type: string
                description: "A log (`deviceLogs`, `appiumLogs`, `xcuitestLogs`, `wdaLogs`): one JSON entry per line."
              example: |
                {"level":"INFO","message":"ActivityManager : Start proc 12345:com.example.app/u0a123 for activity","tag":"ActivityManager","processId":1234,"timestamp":"2026-11-26 10:00:00.123"}
            application/json:
              schema:
                description: "`testCases`, `appiumRequests`, `network.har`, `insights.json`, `crash.json`, `deviceEvents.json`, or a log requested with `Accept: application/json`."
              examples:
                testCases:
                  summary: testCases of an Espresso test
                  value:
                    - className: "CheckoutTest"
                      testCases:
                        - className: "CheckoutTest"
                          methodName: "guestCheckoutSucceeds"
                          startTime: 1410
                          duration: 7370
                          status: "SUCCESS"
            application/xml:
              schema:
                type: string
                description: "`junit.xml`"
              example: |
                <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                <testsuite name="Checkout flow — release 4.2" tests="1" failures="0" skipped="0" timestamp="2026-11-26T10:00:00.000Z" time="10.063" package="com.example.app">
                    <testcase name="guestCheckoutSucceeds" classname="CheckoutTest" time="7.37"/>
                </testsuite>
            video/mp4:
              schema:
                type: string
                format: binary
                description: "`video.mp4`"
            application/x-zip-compressed:
              schema:
                type: string
                format: binary
                description: "`screenshots.zip`: one PNG per screenshot."
        "206":
          description: Partial Content. The requested byte range of `video.mp4`.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "400":
          description: Bad Request. `junit.xml` was requested for a test that is still running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: "JOB_NOT_FOUND"
                message: "Test report '0123456789abcdef0123456789abcdef' is still running."
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/JobForbidden"
        "404":
          description: |
            Not Found. The test does not exist, or the test has no such file: `junit.xml` or `testCases` for a test
            that is not an Espresso, XCUITest or XCTest test; `screenshots.zip` for a test without screenshots;
            `video.mp4` for a test without a video (empty body); or an `asset` that is not in the table (empty body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                jobNotFound:
                  value:
                    code: "JOB_NOT_FOUND"
                    message: "Job '0123456789abcdef0123456789abcdef' not found"
                notNative:
                  summary: junit.xml or testCases for an Appium or Live Testing test
                  value:
                    code: "JOB_NOT_FOUND"
                    message: "Test report '0123456789abcdef0123456789abcdef' with type 'APPIUM' is not a native framework test."
                noScreenshots:
                  value:
                    code: "SCREENSHOT_NOT_FOUND"
                    message: "No screenshots found for job '0123456789abcdef0123456789abcdef'"

  /v1/rdc/native-composer/tests:
    post:
      operationId: startNativeTest
      summary: Start a XCTest, XCUITest or Espresso Job
      description: |
        Runs your Espresso, XCUITest or XCTest tests on a real device — the same test runs you can start with
        [`saucectl`](https://docs.saucelabs.com/dev/cli/saucectl/), from any HTTP client.

        **How it works**

        1. Upload your app and your test bundle to [App Storage](https://docs.saucelabs.com/mobile-apps/app-storage/)
           (an `.apk` and an `androidTest` `.apk` for Espresso; an `.ipa` and a `-Runner.ipa` for XCUITest; an `.ipa`
           and an `.xctestrun` file for XCTest).
        2. Call this endpoint with the two files, the device you want, and any options — test selection, environment
           variables, a Sauce Connect tunnel, network throttling, device language and orientation.
        3. The response gives you the test id and a link to the test in the Sauce Labs UI, immediately. The test then
           runs on the device in the background: watch it live in the Sauce Labs UI, or poll
           [Get a Specific Real Device Job](#tag/Jobs/operation/getJob) with the same id until `status` is `passed`,
           `failed`, `error` or `complete`, and download the results from there.

        **Choosing the framework.** `test_framework` decides which test bundle field and which options apply:

        | `test_framework` | Platform | Your test bundle | Framework options |
        |---|---|---|---|
        | `ANDROID_INSTRUMENTATION` (Espresso) | Android | `test_app_id` — the `androidTest` APK | `use_test_orchestrator`, `test_options` |
        | `XCUITEST` | iOS | `test_app_id` — the `<Target>-Runner.ipa` | `tests_to_run`, `tests_to_skip`, `env` |
        | `XCTEST` | iOS | `xc_test_run_file` — the `.xctestrun` file | none (the file carries the test plan) |

        The app, the test bundle and every app in `other_apps` must be built for the platform of that framework, and
        iOS builds must target a real device, not a simulator.

        **Good to know**

        - Field names are `snake_case`. Enum values are case sensitive unless a field says otherwise.
        - Requests with a malformed body, an unknown `test_framework` or `device_query.type`, an invalid app reference,
          a missing required field or more than seven `other_apps` are rejected with `400` and no test is started.
        - Anything that can only be checked once the files and a device are involved — a file that does not exist, an
          app built for the wrong platform or for a simulator, no device matching your query, an invalid `device_name`
          pattern — makes the test end with status `error` after it was accepted. The reason is shown on the test in
          the UI and in the `error` field of [Get a Specific Real Device Job](#tag/Jobs/operation/getJob).

        **New to native testing on Sauce Labs?** The [Espresso](https://docs.saucelabs.com/mobile-apps/automated-testing/espresso-xcuitest/espresso/),
        [XCUITest](https://docs.saucelabs.com/mobile-apps/automated-testing/espresso-xcuitest/xcuitest/) and
        [XCTest](https://docs.saucelabs.com/mobile-apps/automated-testing/espresso-xcuitest/xctest/) guides explain how
        to build and upload the test bundles.
      tags:
        - "Jobs"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/EspressoTestRequest"
                - $ref: "#/components/schemas/XcuiTestRequest"
                - $ref: "#/components/schemas/XcTestRequest"
              discriminator:
                propertyName: test_framework
                mapping:
                  ANDROID_INSTRUMENTATION: "#/components/schemas/EspressoTestRequest"
                  XCUITEST: "#/components/schemas/XcuiTestRequest"
                  XCTEST: "#/components/schemas/XcTestRequest"
            examples:
              espressoMinimal:
                summary: Espresso — run all tests on any available Android device
                value:
                  test_framework: "ANDROID_INSTRUMENTATION"
                  app_id: "storage:filename=app-debug.apk"
                  test_app_id: "storage:filename=app-debug-androidTest.apk"
                  device_query:
                    type: "DynamicDeviceQuery"
              espressoFull:
                summary: Espresso — choose the device, run one test class, use a tunnel, throttle the network, capture network traffic
                value:
                  test_framework: "ANDROID_INSTRUMENTATION"
                  test_name: "Checkout flow — release 4.2"
                  build: "release-4.2.0"
                  tags: ["smoke", "checkout"]
                  app_id: "4f3a2d1c-8b7e-4c6d-9a5f-1e2d3c4b5a69"
                  test_app_id: "8e7d6c5b-4a39-4f28-b1c0-d9e8f7a6b5c4"
                  other_apps: ["storage:filename=companion-app.apk"]
                  device_query:
                    type: "DynamicDeviceQuery"
                    device_name: "Samsung Galaxy S2[0-9].*"
                    platform_version: "14"
                    requested_device_type: "PHONE"
                    private_devices_only: false
                    carrier_connectivity_requested: false
                  use_test_orchestrator: true
                  test_options: { "class": "com.example.CheckoutTest", "clearPackageData": "true" }
                  tunnel_name: "my-tunnel"
                  tunnel_owner: "tunnel-owner-username"
                  network_profile: "4G-slow"
                  settings_overwrite:
                    instrumentation_enabled: true
                    instrumentation:
                      network_capture: true
                      vitals: true
                    orientation: "PORTRAIT"
                    lang: "en_GB"
              xcuitest:
                summary: XCUITest — run one test class on a specific iPhone with environment variables and custom network conditions
                value:
                  test_framework: "XCUITEST"
                  test_name: "Login tests on iPhone 16"
                  app_id: "storage:filename=MyApp.ipa"
                  test_app_id: "storage:filename=MyAppUITests-Runner.ipa"
                  device_query:
                    type: "HardcodedDeviceQuery"
                    device_descriptor_id: "iPhone_16_real"
                  tests_to_run: ["MyAppUITests.LoginTests"]
                  env:
                    BASE_URL: "https://staging.example.com"
                  network_conditions:
                    download_speed: 5000
                    upload_speed: 3000
                    latency: 200
                    loss: 2
              xctest:
                summary: XCTest — run a test plan from an .xctestrun file on any iPhone running iOS 26
                value:
                  test_framework: "XCTEST"
                  test_name: "XCTest plan — nightly"
                  app_id: "storage:filename=Runner.ipa"
                  xc_test_run_file: "2c1b0a9f-8e7d-4c6b-a5f4-e3d2c1b0a9f8"
                  device_query:
                    type: "DynamicDeviceQuery"
                    device_name: "iPhone.*"
                    platform_version: "26"
      responses:
        "200":
          description: The test was started. Use `test_report.url` to open it, or `test_report.id` with the other Jobs endpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestExecutionResponse"
        "400":
          $ref: "#/components/responses/NativeTestBadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/NativeTestForbidden"

  /v1/rdc/jobs/{job_id}/stop:
    put:
      operationId: stopJob
      summary: Stop a Job
      description: |
        Stops a test that is `in progress`: an Appium, Espresso, XCUITest, XCTest or Live Testing test. The test ends
        with status `error` and the message `User Abandoned Test -- User terminated` in its `error` field; the video
        and logs recorded up to that point stay available, and an Espresso or XCUITest test keeps a JUnit report with
        one cancelled test case.

        A test that has already ended (`status` is `passed`, `failed`, `error` or `complete`) cannot be stopped: the
        call returns `400` and the test keeps its result.

        An Appium test that is still waiting for a device is cancelled before it starts. One that has a device but no
        Appium session yet cannot be stopped at that moment: retry a little later.
      tags:
        - "Jobs"
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The test was stopped. The body is empty.
        "400":
          description: Bad Request. The test cannot be stopped in its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                alreadyFinished:
                  summary: A test that has already ended (any type)
                  value:
                    code: "BAD_REQUEST"
                    message: "The test cannot be stopped because the test execution has already finished. Only tests in progress can be stopped"
                liveSetup:
                  summary: A Live Testing session that has no device yet
                  value:
                    code: "BAD_REQUEST"
                    message: "Cannot stop test in the setup phase. Test needs to be in progress before it can be stopped"
                appiumNotStarted:
                  summary: An Appium test that has a device but whose test has not started
                  value:
                    code: "BAD_REQUEST"
                    message: "Cannot stop test, a device was already assigned to the job. \nPlease try again later and contact your Sauce Labs representative if you continue to see this message."
                appiumNoSession:
                  summary: An Appium test whose Appium session is not set up yet
                  value:
                    code: "BAD_REQUEST"
                    message: "Appium Session was not yet setup, while a device was already assigned to your test.  \nPlease try again later and contact your Sauce Labs representative if you continue to see this message."
                appiumSessionGone:
                  summary: An Appium test whose session is no longer open
                  value:
                    code: "BAD_REQUEST"
                    message: "Only in progress appium session can be stopped"
                unsupportedType:
                  summary: A test type that cannot be stopped through this endpoint
                  value:
                    code: "BAD_REQUEST"
                    message: "Session identified as 'VIRTUAL_USB' test. It can't be stopped because it's not part of the allowed test types: Appium, Espresso, XCUITest, Live"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/JobForbidden"
        "404":
          $ref: "#/components/responses/JobNotFound"
        "500":
          description: Internal Server Error. The device could not be reached to stop the test. Retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                appium:
                  value:
                    code: "INTERNAL_SERVER_ERROR"
                    message: "Session could not be closed, try again"
                appiumRequestFailed:
                  value:
                    code: "INTERNAL_SERVER_ERROR"
                    message: "Failed to stop a session. Please try again"
                native:
                  value:
                    code: "INTERNAL_SERVER_ERROR"
                    message: "Failed to stop the session. Please try again"

  /v1/rdc/device-management/devices:
    get:
      operationId: getPrivateDevices
      summary: Get Private Devices
      description: |
        Returns the private devices of your organization with their current state, the teams they are assigned to and
        their persistence settings (apps, accounts and folders kept between sessions). Organization admins only.
      tags:
        - "Private Real Device Management"
      responses:
        "200":
          description: The private devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedDevice"
              examples:
                devices:
                  $ref: "#/components/examples/ManagedDevices"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/NotOrgAdmin"

  /v1/rdc/device-management/devices/{device_id}/teams:
    put:
      operationId: assignDeviceTeams
      summary: Manage Device Assignment to Teams
      description: |
        Assigns a private device to one or more teams, so only their members can use it. The list you send replaces the
        current assignment: send every team the device should belong to, or an empty list to make the device available
        to the whole organization again. Organization admins only.

        Team ids are the `id` of a team in the
        [Accounts API](https://docs.saucelabs.com/dev/api/accounts/#lookup-teams) or in the Sauce Labs UI under
        **Organization Management > Teams**.
      tags:
        - "Private Real Device Management"
      parameters:
        - $ref: "#/components/parameters/PrivateDeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamsUpdateRequest"
            examples:
              twoTeams:
                summary: Assign the device to two teams
                value:
                  ids: ["8f0444d7762548bd81ae46722a14e1c6", "1ae46722a14e1c68f0444d7762548bd8"]
              unassign:
                summary: Remove every team assignment
                value:
                  ids: []
      responses:
        "204":
          description: The assignment was saved. The body is empty.
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          $ref: "#/components/responses/NotOrgAdmin"
        "404":
          description: Not Found, with an empty body. The device is not a private device of your organization.
        "422":
          description: Unprocessable Entity, with an empty body. One of the team ids does not belong to a team of your organization; nothing was changed.
        "500":
          description: Internal Server Error. The body could not be read — it is not valid JSON, it is empty, or `ids` is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"

  /v1/rdc/device-management/devices/{device_id}/settings:
    put:
      operationId: updateDeviceSettings
      summary: Update Device Settings
      description: |
        Sets what persists on a private device between sessions: installed apps and their data, Google and Apple
        account sign-ins, iOS system apps your tests may use, Apple Pay support and, on Android, folders that are not
        wiped. The settings you send replace the stored ones, so send all of them every time. Organization admins only.
        See [the available device settings](https://docs.saucelabs.com/basics/acct-team-mgmt/private-device-mgmt/#app-allow-list)
        for what each setting does.

        `systemAppAllowlist` and `applePaySupportEnabled` apply to iOS devices only and are ignored on Android.
        Each list holds at most 100 entries.

        The response is the full list of your private devices, as returned by
        [Get Private Devices](#tag/Private-Real-Device-Management/operation/getPrivateDevices), with the new settings
        applied.
      tags:
        - "Private Real Device Management"
      parameters:
        - $ref: "#/components/parameters/PrivateDeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSettings"
            examples:
              ios:
                summary: Keep an app, an Apple ID and the Calculator app on an iPhone
                value:
                  id: "iPhone_15_Pro_private"
                  appWhitelist: ["com.example.app"]
                  accountWhitelist: ["qa-tester@example.com"]
                  systemAppAllowlist: ["com.apple.calculator"]
                  applePaySupportEnabled: false
                  skipCleaningFolders: []
              android:
                summary: Keep an app and the Downloads folder on an Android device
                value:
                  id: "Google_Pixel_9_private"
                  appWhitelist: ["com.example.app"]
                  accountWhitelist: []
                  systemAppAllowlist: []
                  applePaySupportEnabled: false
                  skipCleaningFolders: ["/sdcard/Download"]
      responses:
        "200":
          description: The settings were saved. The body lists all your private devices with their settings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedDevice"
              examples:
                devices:
                  $ref: "#/components/examples/ManagedDevices"
        "401":
          $ref: "#/components/responses/NotAuthorized"
        "403":
          description: Forbidden. You are not an organization admin, or a list has more than 100 entries. Nothing was changed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                notAdmin:
                  value:
                    title: "Insufficient Auth to update device settings"
                    detail: "Could not update device settings! Only Org Admins can update device settings."
                tooManyEntries:
                  value:
                    title: "Insufficient Auth to update device settings"
                    detail: "Could not update device settings! The maximum size of app allowlist is 100."
        "404":
          description: Not Found, with an empty body. The device is not a private device of your organization.
        "500":
          description: Internal Server Error. The body could not be read — it is not valid JSON or it is empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic Authentication using your Sauce Labs credentials.
        - **Username**: Your Sauce Labs username.
        - **Password**: Your Sauce Labs access key.

        You can find both your username and access key on the **Account > User Settings** page in the Sauce Labs UI.

  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      description: "The device id, as listed by [Get Devices](#tag/Real-Devices/operation/getDevices)."
      schema:
        type: string
      example: "Samsung_Galaxy_S24_real"
    PrivateDeviceId:
      name: device_id
      in: path
      required: true
      description: "The id of one of your private devices, as listed by [Get Private Devices](#tag/Private-Real-Device-Management/operation/getPrivateDevices)."
      schema:
        type: string
      example: "iPhone_15_Pro_private"
    JobId:
      name: job_id
      in: path
      required: true
      description: "The id of the test, as listed by [Get Real Device Jobs](#tag/Jobs/operation/getJobs) or shown in the test's URL in the Sauce Labs UI."
      schema:
        type: string
        pattern: "^[a-f0-9]{32}$"
      example: "0123456789abcdef0123456789abcdef"

  responses:
    NotAuthorized:
      description: Not Authorized. The username or access key is missing or wrong.
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: Authorization failed
          example:
            detail: "Authorization failed"
    JobNotFound:
      description: Not Found. No test with this id exists in this data center, or it was deleted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: "JOB_NOT_FOUND"
            message: "Job '0123456789abcdef0123456789abcdef' not found"
    JobForbidden:
      description: Forbidden. The test belongs to another team of your organization and you are not allowed to see it (you are not an organization admin and cross-team job sharing is off), or it belongs to another organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: "FORBIDDEN"
            message: "Access not allowed"
    NotOrgAdmin:
      description: Forbidden, with an empty body. You are not an organization admin.
    NativeTestBadRequest:
      description: Bad Request. Something in the request is invalid; no test was started. `detail` or `violations` says what to fix.
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/ConstraintViolationProblem"
              - $ref: "#/components/schemas/ProblemDetail"
          examples:
            missingRequiredFields:
              summary: A required field is missing (violations name the fields in camelCase)
              value:
                type: "https://zalando.github.io/problem/constraint-violation"
                title: "Constraint Violation"
                status: 400
                instance: "/tests"
                violations:
                  - field: "appId"
                    message: "must not be null"
                  - field: "deviceQuery"
                    message: "must not be null"
                  - field: "testAppId"
                    message: "must not be null"
            tooManyOtherApps:
              summary: More than seven apps in other_apps
              value:
                type: "https://zalando.github.io/problem/constraint-violation"
                title: "Constraint Violation"
                status: 400
                instance: "/tests"
                violations:
                  - field: "otherApps"
                    message: "size must be between 0 and 7"
            invalidAppReference:
              summary: An app reference that is not a file id or a storage:filename= reference
              value:
                title: "Bad Request"
                status: 400
                instance: "/tests"
                detail: "JSON parse error: Cannot construct instance of `com.saucelabs.rdcnativecomposerservice.api.resource.AppStorageReference`, problem: Invalid app reference: 'not-an-app'"
            unknownTestFramework:
              summary: test_framework is not ANDROID_INSTRUMENTATION, XCUITEST or XCTEST (the value is case sensitive)
              value:
                title: "Bad Request"
                status: 400
                instance: "/tests"
                detail: "JSON parse error: Could not resolve type id 'xcuitest' as a subtype of `com.saucelabs.rdcnativecomposerservice.api.resource.TestExecutionRequest`: known type ids = []"
            unknownDeviceQueryType:
              summary: device_query.type is not DynamicDeviceQuery or HardcodedDeviceQuery
              value:
                title: "Bad Request"
                status: 400
                instance: "/tests"
                detail: "JSON parse error: Could not resolve type id 'SomethingElse' as a subtype of `com.saucelabs.rdcnativecomposerservice.api.resource.DeviceRequest`: known type ids = [] (for POJO property 'device_query')"
            unknownNetworkProfile:
              summary: network_profile is not one of the predefined profiles
              value:
                title: "Bad Request"
                status: 400
                instance: "/tests"
                detail: "JSON parse error: Cannot construct instance of `com.saucelabs.rdcnativecomposerservice.model.job.NetworkProfile`, problem: Unknown network profile: 5G"
            malformedJson:
              summary: The body is not valid JSON
              value:
                title: "Bad Request"
                status: 400
                instance: "/tests"
                detail: "JSON parse error: Unexpected end-of-input within/between Object entries"
    NativeTestForbidden:
      description: Forbidden. Your account cannot run native tests on real devices.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            trialExpired:
              summary: Free trial accounts cannot run native tests
              value:
                title: "Forbidden"
                status: 403
                instance: "/tests"
                detail: "Your trial period has ended. Please upgrade to a paid plan."

