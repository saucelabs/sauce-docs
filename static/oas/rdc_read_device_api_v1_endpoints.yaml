  schemas:
    # ---------------------------------------------------------------- Real Devices
    DeviceDescriptor:
      type: object
      description: One device model and OS version, with its specifications and capabilities.
      properties:
        id:
          type: string
          description: "The device id. Use it to refer to this device in other endpoints and in test configurations."
          example: "Samsung_Galaxy_S24_real"
        name:
          type: string
          description: "The device name shown in the Sauce Labs UI."
          example: "Samsung Galaxy S24"
        manufacturer:
          type: array
          description: "The manufacturer(s) of the device."
          items:
            type: string
          example: ["Samsung"]
        modelNumber:
          type: string
          description: "The manufacturer's model number."
          example: "SM-S921B"
        os:
          type: string
          description: "The operating system."
          enum: [ANDROID, IOS]
        osVersion:
          type: string
          description: "The installed OS version."
          example: "14"
        apiLevel:
          type: integer
          description: "The Android API level. `0` on iOS."
          example: 34
        abiType:
          type: string
          description: "The CPU architecture (ABI) apps must be built for, for example `arm64-v8a` on Android or `arm64` on iOS."
          example: "arm64-v8a"
        cpuType:
          type: string
          description: "The CPU family."
          enum: [ARM, X86]
        isArm:
          type: boolean
          description: "Whether the CPU is an ARM CPU."
        cpuCores:
          type: integer
          description: "The number of CPU cores."
          example: 8
        cpuFrequency:
          type: integer
          description: "The CPU frequency in MHz."
          example: 3300
        ramSize:
          type: integer
          description: "The RAM size in MB."
          example: 8192
        internalStorageSize:
          type: integer
          description: "The internal storage size in MB."
          example: 131072
        sdCardSize:
          type: integer
          description: "The SD card size in MB. `0` when the device has none."
          example: 0
        screenSize:
          type: number
          format: double
          description: "The screen diagonal in inches."
          example: 6.2
        resolutionWidth:
          type: integer
          description: "The screen width in pixels."
          example: 1080
        resolutionHeight:
          type: integer
          description: "The screen height in pixels."
          example: 2340
        dpi:
          type: integer
          description: "The screen density in dots per inch."
          example: 500
        dpiName:
          type: string
          description: "The Android density bucket of the screen (`mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, `xxxhdpi`), or `unknown`."
          example: "xxhdpi"
        pixelsPerPoint:
          type: integer
          description: "The number of pixels per point (iOS scale factor); `1` on Android."
          example: 1
        isTablet:
          type: boolean
          description: "Whether the device is a tablet."
        deviceFamily:
          type: string
          description: "`IPHONE` or `IPAD` for iOS devices, `ANY` for Android devices."
          enum: [ANY, IPHONE, IPAD]
        defaultOrientation:
          type: string
          description: "The orientation the device starts a test in."
          enum: [PORTRAIT, LANDSCAPE]
        internalOrientation:
          type: string
          description: "The orientation of the device's screen hardware."
          enum: [PORTRAIT, LANDSCAPE]
        hasOnScreenButtons:
          type: boolean
          description: "Whether the navigation buttons are on screen rather than physical."
        isPrivate:
          type: boolean
          description: "`true` for a private device of your organization, `false` for a public device."
        isRooted:
          type: boolean
          description: "Whether the device is rooted or jailbroken."
        isKeyGuardDisabled:
          type: boolean
          description: "Whether the lock screen is disabled."
        isAlternativeIoEnabled:
          type: boolean
          description: "Whether the device uses the alternative input/output path for screen streaming and input."
        supportsAppiumWebAppTesting:
          type: boolean
          description: "Whether Appium can test web apps in the device's browser."
        supportsManualWebTesting:
          type: boolean
          description: "Whether Live Testing can open web pages on the device."
        supportsXcuiTest:
          type: boolean
          description: "Whether XCUITest tests can run on the device."
        supportsMultiTouch:
          type: boolean
          description: "Whether multi-touch gestures are supported."
        supportsMockLocations:
          type: boolean
          description: "Whether the GPS location can be mocked."
        supportsGlobalProxy:
          type: boolean
          description: "Whether a device-wide HTTP proxy can be set."
        supportsMinicapSocketConnection:
          type: boolean
          description: "Whether the device supports the minicap screen streaming connection."
    DeviceState:
      type: string
      description: The state of a device.
      enum: [AVAILABLE, IN_USE, CLEANING, REBOOTING, MAINTENANCE, OFFLINE]
    DevicesStatusResponse:
      type: object
      required:
        - devices
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceStatus"
    DeviceStatus:
      type: object
      description: The current state of one device model.
      required:
        - descriptor
        - state
        - inUseBy
        - isPrivateDevice
      properties:
        descriptor:
          type: string
          description: "The device id."
          example: "Samsung_Galaxy_S24_real"
        state:
          $ref: "#/components/schemas/DeviceState"
        inUseBy:
          type: array
          description: "Who is using the device: the username, for a private device that is `IN_USE` when you are allowed to see it. Empty otherwise."
          items:
            type: object
            required:
              - username
            properties:
              username:
                type: string
                example: "teammate-username"
        isPrivateDevice:
          type: boolean
          description: "`true` for a private device of your organization."

    # ---------------------------------------------------------------- Jobs
    JobStatus:
      type: string
      description: |
        The status of a test.
        - `in progress` — the test is queued or running.
        - `passed` — the test ran and passed.
        - `failed` — the test ran and at least one test case failed, or the test was marked as failed.
        - `error` — the test could not run or was stopped; the reason is in `error`.
        - `complete` — the test ended without a pass/fail result, for example a Live Testing session.
      enum: ["in progress", "passed", "failed", "error", "complete"]
    JobType:
      type: string
      description: |
        The type of a test.
        - `APPIUM` — an Appium test.
        - `ANDROID_INSTRUMENTATION` — an Espresso test.
        - `XCUITEST` — an XCUITest or XCTest test.
        - `LIVE` — a Live Testing session.
        - `API` — a Real Device Access API session.
        - `VIRTUAL_USB` — a Virtual USB session.
      enum: [APPIUM, ANDROID_INSTRUMENTATION, XCUITEST, LIVE, API, VIRTUAL_USB]
    JobList:
      type: object
      description: One page of tests.
      required:
        - entities
        - metaData
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/JobSummary"
        metaData:
          type: object
          description: The page you received.
          required:
            - offset
            - limit
            - moreAvailable
            - sortDirection
          properties:
            offset:
              type: integer
              description: "The 1-based position of the first test in this page."
              example: 1
            limit:
              type: integer
              description: "The page size that was applied."
              example: 20
            moreAvailable:
              type: boolean
              description: "`true` when more tests follow this page."
            sortDirection:
              type: string
              description: "Always `DESCENDING`: newest tests first."
              enum: [DESCENDING]
    JobSummary:
      type: object
      description: One test in a list.
      properties:
        id:
          type: string
          description: "The id of the test."
          example: "0123456789abcdef0123456789abcdef"
        name:
          type: string
          description: "The name of the test."
          example: "Checkout flow — release 4.2"
        status:
          $ref: "#/components/schemas/JobStatus"
        consolidated_status:
          allOf:
            - $ref: "#/components/schemas/JobStatus"
          description: "Same as `status`."
        test_report_type:
          $ref: "#/components/schemas/JobType"
        automation_backend:
          type: string
          nullable: true
          description: "The automation framework of an automated test, or `null` for a Live Testing or Virtual USB session."
          enum: [APPIUM, ESPRESSO, XCUITEST, API, null]
        manual:
          type: boolean
          description: "`true` for a Live Testing or Virtual USB session, `false` for an automated test."
        owner_sauce:
          type: string
          description: "The username of the user who started the test."
          example: "your-username"
        device_type:
          type: string
          description: "Always `real_device`."
          enum: [real_device]
        device_name:
          type: string
          nullable: true
          description: "The name of the device the test ran on, or `null` while no device is assigned."
          example: "Samsung Galaxy S24"
        os:
          type: string
          nullable: true
          description: "`Android` or `iOS`, or `null` while no device is assigned."
          example: "Android"
        os_version:
          type: string
          nullable: true
          description: "The OS version of the device, or `null` while no device is assigned."
          example: "14"
        creation_time:
          type: integer
          format: int64
          description: "When the test started, in milliseconds since the Unix epoch (same value as `start_time` in a list entry)."
          example: 1764160800000
        start_time:
          type: integer
          format: int64
          description: "When the test started on the device, in milliseconds since the Unix epoch."
          example: 1764160800000
        end_time:
          type: integer
          format: int64
          description: "When the test ended, in milliseconds since the Unix epoch. Equal to `start_time` while the test is running."
          example: 1764160859000
        assigned_tunnel_id:
          type: string
          nullable: true
          description: "The name of the Sauce Connect tunnel used by the test, or `null`."
        has_crashed:
          type: boolean
          description: "`true` when a crash report was captured for the test."
    Job:
      type: object
      description: One test in full.
      properties:
        id:
          type: string
          description: "The id of the test."
          example: "0123456789abcdef0123456789abcdef"
        name:
          type: string
          description: "The name of the test."
          example: "Checkout flow — release 4.2"
        status:
          $ref: "#/components/schemas/JobStatus"
        consolidated_status:
          allOf:
            - $ref: "#/components/schemas/JobStatus"
          description: "Same as `status`."
        passed:
          type: boolean
          nullable: true
          description: "`true` or `false` once the test has a result; `null` while it is running or when it has no pass/fail result."
        error:
          type: string
          nullable: true
          description: "Why the test ended with status `error`, for example the app could not be installed, no device matched, or the test was stopped. `null` otherwise."
        warnings:
          type: array
          description: "Warnings raised while the test ran that you should know about."
          items:
            type: object
            properties:
              value:
                type: string
        test_report_type:
          $ref: "#/components/schemas/JobType"
        automation_backend:
          type: string
          nullable: true
          description: "The automation framework of an automated test, or `null` for a Live Testing or Virtual USB session."
          enum: [appium, espresso, xcuitest, api, null]
        manual:
          type: boolean
          description: "`true` for a Live Testing or Virtual USB session, `false` for an automated test."
        owner_sauce:
          type: string
          description: "The username of the user who started the test."
          example: "your-username"
        client:
          type: string
          nullable: true
          description: "The client that started the test, from its `User-Agent`, for example `saucectl/0.215.0`."
          example: "saucectl/0.215.0"
        build:
          type: string
          nullable: true
          description: "The build the test belongs to, or `null`."
          example: "release-4.2.0"
        tags:
          type: array
          description: "The tags of the test."
          items:
            type: string
          example: ["smoke", "checkout"]
        creation_time:
          type: integer
          format: int64
          description: "When the test was requested, in milliseconds since the Unix epoch."
          example: 1764160790000
        start_time:
          type: integer
          format: int64
          description: "When the test started on the device, in milliseconds since the Unix epoch."
          example: 1764160800000
        end_time:
          type: integer
          format: int64
          description: "When the test ended, in milliseconds since the Unix epoch. Equal to `start_time` while the test is running."
          example: 1764160859000
        modification_time:
          type: integer
          format: int64
          description: "Same as `end_time`."
          example: 1764160859000
        device_type:
          type: string
          description: "Always `real_device`."
          enum: [real_device]
        device_name:
          type: string
          nullable: true
          description: "The name of the device the test ran on, or `null` while no device is assigned."
          example: "Samsung Galaxy S24"
        os:
          type: string
          nullable: true
          description: "`Android` or `iOS`, or `null` while no device is assigned."
          example: "Android"
        os_version:
          type: string
          nullable: true
          description: "The OS version of the device, or `null` while no device is assigned."
          example: "14"
        device_descriptor:
          allOf:
            - $ref: "#/components/schemas/DeviceDescriptor"
          nullable: true
          description: "The device the test ran on, or `null` while no device is assigned."
        application_summary:
          allOf:
            - $ref: "#/components/schemas/ApplicationSummary"
          nullable: true
          description: "The app under test, from App Storage. `null` when the test did not use an app from App Storage."
        app_settings:
          allOf:
            - $ref: "#/components/schemas/AppSettings"
          nullable: true
          description: "The settings the app ran with. `null` when `application_summary` is `null`."
        xctestrunfile_info:
          allOf:
            - $ref: "#/components/schemas/ApplicationSummary"
          nullable: true
          description: "For an XCTest test, the `.xctestrun` file from App Storage. `null` otherwise."
        remote_app_file_url:
          type: string
          nullable: true
          description: "The app reference the test was started with, when it was not an App Storage file. `null` otherwise."
        video_url:
          type: string
          format: uri
          nullable: true
          description: "Download link for the video of the test, or `null` when there is none."
        device_log_url:
          type: string
          format: uri
          description: "Download link for the device log."
        framework_log_url:
          type: string
          format: uri
          nullable: true
          description: "Download link for the Appium log (Appium tests, and Access API sessions that requested it) or the XCUITest log (XCUITest and XCTest tests). `null` for Espresso tests and Live Testing sessions."
        requests_url:
          type: string
          format: uri
          nullable: true
          description: "Download link for the Appium requests of an Appium test. `null` otherwise."
        wda_log_url:
          type: string
          format: uri
          nullable: true
          description: "Download link for the WebDriverAgent log of an Appium test on iOS, when one was captured. `null` otherwise."
        test_cases_url:
          type: string
          format: uri
          nullable: true
          description: "Download link for the test cases of an Espresso, XCUITest or XCTest test. `null` otherwise."
        junit_log_url:
          type: string
          format: uri
          nullable: true
          description: "Download link for the JUnit report of an Espresso, XCUITest or XCTest test. `null` otherwise."
        network_log_url:
          type: string
          format: uri
          nullable: true
          description: "Download link for the network capture (HAR), when network capture was on. `null` otherwise."
        testfairy_log_url:
          type: string
          format: uri
          nullable: true
          description: "Download link for the device vitals, when vitals were on. `null` otherwise."
        crash_log_url:
          type: string
          format: uri
          nullable: true
          description: "Download link for the crash report, when a crash was captured. `null` otherwise."
        device_events_url:
          type: string
          format: uri
          nullable: true
          description: "Download link for the device events of an Appium test, when captured. `null` otherwise."
        backtrace_url:
          type: string
          format: uri
          nullable: true
          description: "Link to the crash and error reports of the app in Sauce Labs Error Reporting, when enabled. `null` otherwise."
        screenshots:
          type: array
          description: "The screenshots taken during the test, each with its download link."
          items:
            type: object
            properties:
              id:
                type: string
                example: "screenshot_first"
              url:
                type: string
                format: uri
                example: "https://api.us-west-1.saucelabs.com/v1/rdc/jobs/0123456789abcdef0123456789abcdef/screenshots/screenshot_first"
        record_video:
          type: boolean
          description: "Whether a video was recorded. Always `true` except for Access API sessions that opted out."
        record_screenshots:
          type: boolean
          description: "Always `true`."
        collects_automator_log:
          type: boolean
          description: "Always `true`."
        assigned_tunnel_id:
          type: string
          nullable: true
          description: "The name of the Sauce Connect tunnel used by the test, or `null`."
        proxied:
          type: boolean
          description: "`true` when the test used a Sauce Connect tunnel."
        has_network_conditioning:
          type: boolean
          description: "`true` when the test ran with a network profile or custom network conditions."
        appium_session_id:
          type: string
          nullable: true
          description: "The Appium session id of an Appium test. `null` otherwise."
        appium_version:
          type: string
          nullable: true
          description: "The Appium version of an Appium test, as requested (for example `latest` or `2.11.0`). `null` otherwise."
        api_session_id:
          type: string
          nullable: true
          description: "The session id of a Real Device Access API session. `null` otherwise."
        device_session_id:
          type: string
          nullable: true
          description: "The id of the shared Live View of an Appium test, when one was opened. `null` otherwise."
        device_context_id:
          type: string
          nullable: true
          description: "The id of the device session the test ran in. `null` while no device is assigned."
          example: "9e8d7c6b-5a49-4f38-b2c1-0d9e8f7a6b5c"
        used_cached_device:
          type: boolean
          nullable: true
          description: "For Appium tests, whether the device was reused from a previous session of the same test. `null` for other test types."
        base_config:
          type: object
          description: "Reserved; always empty."
        custom-data:
          type: object
          nullable: true
          description: "The custom data set on an Appium test with the `custom-data` capability. `null` otherwise."
          additionalProperties: true
    ApplicationSummary:
      type: object
      description: An app file in App Storage.
      properties:
        appStorageId:
          type: string
          format: uuid
          description: "The file id in App Storage."
          example: "4f3a2d1c-8b7e-4c6d-9a5f-1e2d3c4b5a69"
        groupId:
          type: integer
          format: int64
          description: "The id of the app group in App Storage that the file belongs to."
          example: 123456
        filename:
          type: string
          example: "app-debug.apk"
        name:
          type: string
          nullable: true
          description: "The app name read from the file."
          example: "My Demo App"
        packageName:
          type: string
          nullable: true
          description: "The Android package name or iOS bundle id."
          example: "com.example.app"
        version:
          type: string
          nullable: true
          example: "4.2.0"
        versionCode:
          type: string
          nullable: true
          description: "The Android version code."
          example: "42"
        shortVersion:
          type: string
          nullable: true
          description: "The iOS short version."
        minSdkLevel:
          type: integer
          nullable: true
          description: "The minimum Android API level. `null` on iOS."
          example: 24
        targetSdkLevel:
          type: integer
          nullable: true
          description: "The target Android API level. `null` on iOS."
          example: 34
        minOsVersion:
          type: string
          nullable: true
          description: "The minimum iOS version. `null` on Android."
        targetOsVersion:
          type: string
          nullable: true
          description: "The target iOS version. `null` on Android."
        tags:
          type: array
          description: "The tags of the file in App Storage."
          items:
            type: string
    AppSettings:
      type: object
      description: The settings the app ran with (see **App Management > Settings** in the Sauce Labs UI).
      properties:
        proxy:
          type: object
          description: "The HTTP proxy the device's traffic went through. `enabled: false` with an empty `hostname` and `port: -1` when none was used."
          properties:
            enabled:
              type: boolean
            hostname:
              type: string
            port:
              type: integer
            username:
              type: string
              nullable: true
            password:
              type: string
              nullable: true
        deviceOrientation:
          type: string
          nullable: true
          enum: [PORTRAIT, LANDSCAPE, null]
        locale:
          type: string
          nullable: true
          description: "The device language and region, for example `en_GB`, or `null` for the device default."
        resigningEnabled:
          type: boolean
          description: "Whether the app was re-signed (iOS) or instrumented (Android) by Sauce Labs."
        systemAlertsDelayEnabled:
          type: boolean
        biometricsInterceptionEnabled:
          type: boolean
        groupFolderRedirectEnabled:
          type: boolean
        imageInjectionEnabled:
          type: boolean
        audioInjectionEnabled:
          type: boolean
        networkCaptureEnabled:
          type: boolean
        vitalsEnabled:
          type: boolean
        testfairyEnabled:
          type: boolean
          description: "Same as `vitalsEnabled`."
        backtraceEnabled:
          type: boolean
        bypassScreenshotRestrictionEnabled:
          type: boolean
        audioSupportEnabled:
          type: boolean
          description: "Whether the device audio was recorded."
        setupDeviceLock:
          type: boolean
    JobUpdateRequest:
      type: object
      description: The fields of a test you can change. Send only the fields you want to change.
      properties:
        name:
          type: string
          description: "A new name for the test: 1 to 255 characters, not blank, no emojis. Leading and trailing spaces are removed."
          minLength: 1
          maxLength: 255
          example: "Checkout flow — release 4.2"
        build:
          type: string
          description: "The build to assign the test to; an existing build name or a new one. 1 to 255 characters: letters, digits, underscores and punctuation, no spaces."
          pattern: "^[\\w\\p{P}]{1,255}$"
          example: "release-4.2.0"
        passed:
          type: boolean
          description: "`true` marks the test as passed, `false` as failed. This sets the test's status and result as you see them in the UI and in the Jobs API."
          example: true
        tags:
          type: array
          description: "The complete set of tags for the test; at most 10. Each tag is 1 to 255 characters: letters, digits, underscores and punctuation, no spaces."
          maxItems: 10
          items:
            type: string
            pattern: "^[\\w\\p{P}]{1,255}$"
          example: ["smoke", "checkout"]
    ApiError:
      type: object
      description: "Error body: a machine-readable `code` and a `message` that says what was wrong."
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: "The error code."
          enum: [BAD_REQUEST, INVALID_REQUEST_PAYLOAD, JOB_NOT_FOUND, SCREENSHOT_NOT_FOUND, FORBIDDEN, INTERNAL_SERVER_ERROR, AUTH_INFO_ISSUE]
          example: "JOB_NOT_FOUND"
        message:
          type: string
          example: "Job '0123456789abcdef0123456789abcdef' not found"
    GenericError:
      type: object
      description: Error body for a request the server could not process.
      properties:
        message:
          type: string
          enum: ["Oops, something went wrong."]
      example:
        message: "Oops, something went wrong."

    # ---------------------------------------------------------------- Start a native test
    NativeTestRequest:
      type: object
      description: Fields available for every test framework.
      required:
        - test_framework
        - app_id
        - device_query
      properties:
        test_framework:
          type: string
          description: "The test framework your test bundle was built with. Case sensitive."
          enum: [ANDROID_INSTRUMENTATION, XCUITEST, XCTEST]
          example: "XCUITEST"
        app_id:
          allOf:
            - $ref: "#/components/schemas/AppStorageReference"
          description: "Your app under test in App Storage: an `.apk` for Espresso, an `.ipa` built for real devices for XCUITest and XCTest."
          example: "storage:filename=MyApp.ipa"
        device_query:
          $ref: "#/components/schemas/DeviceQuery"
        test_name:
          type: string
          description: "The name shown for this test in the Sauce Labs UI. Defaults to `<test_framework>-test`, for example `XCUITEST-test`."
          example: "Checkout flow — release 4.2"
        build:
          type: string
          description: "Groups this test with other tests of the same build in the Sauce Labs UI. Use an existing build name or create a new one."
          default: ""
          example: "release-4.2.0"
        tags:
          type: array
          description: "Tags for finding and filtering this test in the Sauce Labs UI."
          default: []
          items:
            type: string
          example: ["smoke", "checkout"]
        other_apps:
          type: array
          description: "Up to seven additional apps to install on the device before your test runs, for example a companion app your test opens. Same reference format as `app_id`; each app must be built for the same platform as `app_id`."
          maxItems: 7
          default: []
          items:
            $ref: "#/components/schemas/AppStorageReference"
          example: ["storage:filename=companion-app.apk"]
        tunnel_name:
          type: string
          description: "Name of an active [Sauce Connect](https://docs.saucelabs.com/secure-connections/sauce-connect-5/) tunnel, to let the device reach servers behind your firewall."
          example: "my-tunnel"
        tunnel_identifier:
          type: string
          deprecated: true
          description: "Former name of `tunnel_name`. Still accepted; used only when `tunnel_name` is not set."
          example: "my-tunnel"
        tunnel_owner:
          type: string
          description: "Username of the user who started the tunnel, when it is not you (a teammate's shared tunnel)."
          example: "tunnel-owner-username"
        network_profile:
          allOf:
            - $ref: "#/components/schemas/NetworkProfile"
          description: "Simulate a network condition for the whole test with one of the predefined profiles. Case insensitive. Ignored when `network_conditions` is also set."
          example: "4G-slow"
        network_conditions:
          allOf:
            - $ref: "#/components/schemas/NetworkConditions"
          description: "Simulate a custom network condition for the whole test. Takes precedence over `network_profile`."
    EspressoTestRequest:
      description: Run Espresso tests on an Android device.
      allOf:
        - $ref: "#/components/schemas/NativeTestRequest"
        - type: object
          required:
            - test_app_id
          properties:
            test_framework:
              type: string
              enum: [ANDROID_INSTRUMENTATION]
            test_app_id:
              allOf:
                - $ref: "#/components/schemas/AppStorageReference"
              description: "Your Espresso test APK (the `androidTest` build) in App Storage."
              example: "storage:filename=app-debug-androidTest.apk"
            use_test_orchestrator:
              type: boolean
              default: false
              description: "Run each test in its own `Instrumentation` instance with [Android Test Orchestrator](https://docs.saucelabs.com/mobile-apps/automated-testing/espresso-xcuitest/espresso/#usetestorchestrator), so shared state and crashes do not leak between tests. Combine with `test_options.clearPackageData` to also clear the app's data between tests."
            test_options:
              type: object
              description: |
                Which tests to run and how, as string key/value pairs — the same options as
                [`testOptions`](https://docs.saucelabs.com/mobile-apps/automated-testing/espresso-xcuitest/espresso/#testoptions)
                in `saucectl`: `class`, `notClass`, `package`, `notPackage`, `size`, `annotation`, `notAnnotation`,
                `func`, `unit`, `perf`, `filter`, `runnerBuilder`, `listener`, `newRunListenerMode`, `numShards` /
                `shardIndex`, `clearPackageData`, plus any custom key your tests read as an instrumentation argument.
                Values must be strings, so write `"true"` rather than `true`. The keys `testFile`, `notTestFile`,
                `debug`, `log`, `emma` and `coverageFile` are reserved and ignored.
              additionalProperties:
                type: string
              default: {}
              example: { "class": "com.example.CheckoutTest", "clearPackageData": "true" }
            settings_overwrite:
              $ref: "#/components/schemas/AndroidSettingsOverwrite"
    XcuiTestRequest:
      description: Run XCUITest tests on an iOS device.
      allOf:
        - $ref: "#/components/schemas/NativeTestRequest"
        - type: object
          required:
            - test_app_id
          properties:
            test_framework:
              type: string
              enum: [XCUITEST]
            test_app_id:
              allOf:
                - $ref: "#/components/schemas/AppStorageReference"
              description: "Your XCUITest runner app (`<Target>-Runner.ipa`, built for real devices) in App Storage."
              example: "storage:filename=MyAppUITests-Runner.ipa"
            tests_to_run:
              type: array
              description: "Run only these tests. Each entry is a test class, `TestTarget.TestClass`, or a single test, `TestTarget.TestClass/testMethod`. Leave the field out to run every test; an empty list runs none."
              items:
                type: string
              example: ["MyAppUITests.LoginTests", "MyAppUITests.CheckoutTests/testGuestCheckout"]
            tests_to_skip:
              type: array
              description: "Run every test except these. Same entry format as `tests_to_run`."
              items:
                type: string
              example: ["MyAppUITests.SlowTests"]
            env:
              type: object
              description: "Environment variables passed to the test runner process, which your tests can read with `ProcessInfo.processInfo.environment`, as string key/value pairs."
              additionalProperties:
                type: string
              default: {}
              example: { "BASE_URL": "https://staging.example.com" }
            settings_overwrite:
              $ref: "#/components/schemas/IosSettingsOverwrite"
    XcTestRequest:
      description: Run an XCTest test plan on an iOS device.
      allOf:
        - $ref: "#/components/schemas/NativeTestRequest"
        - type: object
          required:
            - xc_test_run_file
          properties:
            test_framework:
              type: string
              enum: [XCTEST]
            xc_test_run_file:
              type: string
              description: "Your `.xctestrun` file in App Storage, produced by `xcodebuild build-for-testing`. It defines which tests run and with which settings. Reference it by file id — `<id>`, `storage:<id>` or `storage://<id>`; the `storage:filename=` form is only available for `.apk` and `.ipa` files."
              pattern: "^(storage:(//)?)?[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$"
              example: "2c1b0a9f-8e7d-4c6b-a5f4-e3d2c1b0a9f8"
            settings_overwrite:
              $ref: "#/components/schemas/IosSettingsOverwrite"
    AppStorageReference:
      type: string
      description: |
        A file in [App Storage](https://docs.saucelabs.com/mobile-apps/app-storage/), referenced in one of these ways:
        - by file id, as shown in App Storage or returned by the upload: `1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d`,
          `storage:1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d` or `storage://1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d`
        - by file name, for `.apk` and `.ipa` files: `storage:filename=MyApp.ipa` — note the single colon and no slashes.
          If you uploaded several files with that name, the most recent one is used.
      pattern: "^((storage:(//)?)?[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}|storage:filename=\\S[\\S ]+\\.(ipa|apk))$"
      example: "storage:filename=MyApp.ipa"
    DeviceQuery:
      description: |
        The device to run on. Either describe the device you want with `DynamicDeviceQuery` and Sauce Labs picks the
        first available match, or name one exact device with `HardcodedDeviceQuery`. The platform is implied by
        `test_framework`, so you do not specify Android or iOS here.
      oneOf:
        - $ref: "#/components/schemas/DynamicDeviceQuery"
        - $ref: "#/components/schemas/HardcodedDeviceQuery"
      discriminator:
        propertyName: type
        mapping:
          DynamicDeviceQuery: "#/components/schemas/DynamicDeviceQuery"
          HardcodedDeviceQuery: "#/components/schemas/HardcodedDeviceQuery"
    DynamicDeviceQuery:
      type: object
      description: "Describe the device you want and let Sauce Labs pick the first available match. All filters are optional: `{ \"type\": \"DynamicDeviceQuery\" }` alone runs on any available device of the framework's platform."
      required:
        - type
      properties:
        type:
          type: string
          enum: [DynamicDeviceQuery]
        device_name:
          type: string
          description: "The device model, as a regular expression that must match the whole device name shown in the Sauce Labs UI — `Samsung Galaxy S2[0-9].*` matches `Samsung Galaxy S24`, `iPhone 1[5-6].*` matches `iPhone 16 Pro` — or an exact device id such as `Samsung_Galaxy_S24_real`. A pattern that matches several models gives you a larger pool of available devices ([Dynamic Device Allocation](https://docs.saucelabs.com/mobile-apps/supported-devices/#dynamic-device-allocation)). An invalid regular expression is accepted here and fails the test afterwards."
          example: "Samsung Galaxy S2[0-9].*"
        platform_version:
          type: string
          description: "The OS version, matched by prefix: `12` matches every 12.x.x version, `12.1` every 12.1.x version, `12.1.1` exactly that version. A regular expression over `MAJOR.MINOR.PATCH` is also accepted, for example `^1[3-4|6].*`. Leave it out for any version; the stricter the filter, the fewer devices qualify."
          example: "14"
        requested_device_type:
          type: string
          description: "Run on a phone, a tablet, or either."
          enum: [ANY, PHONE, TABLET]
          default: ANY
        private_devices_only:
          type: boolean
          default: false
          description: "Use only the private devices of your organization."
        carrier_connectivity_requested:
          type: boolean
          default: false
          description: "Use only devices with a SIM card and mobile network connectivity."
    HardcodedDeviceQuery:
      type: object
      description: "Run on one exact device."
      required:
        - type
        - device_descriptor_id
      properties:
        type:
          type: string
          enum: [HardcodedDeviceQuery]
        device_descriptor_id:
          type: string
          description: "The device id, as listed by [Get Devices](#tag/Real-Devices/operation/getDevices) or shown in the Sauce Labs UI, for example `iPhone_16_real`."
          example: "iPhone_16_real"
        private_devices_only:
          type: boolean
          default: false
          description: "Use only the private devices of your organization."
    NetworkProfile:
      type: string
      description: "A predefined network condition, from no throttling to no network at all. Case insensitive."
      enum:
        - "no-throttling"
        - "no-network"
        - "2G-packet-loss"
        - "2G"
        - "3G-slow"
        - "3G-fast"
        - "4G-slow"
        - "4G-fast"
      example: "4G-slow"
    NetworkConditions:
      type: object
      description: A custom network condition. Every field is optional.
      properties:
        download_speed:
          type: integer
          description: "Download speed in kbps (0 - 50000)."
          example: 5000
        upload_speed:
          type: integer
          description: "Upload speed in kbps (0 - 50000)."
          example: 3000
        latency:
          type: integer
          description: "Latency in ms (0 - 3000)."
          example: 200
        loss:
          type: integer
          description: "Packet loss in percent (0 - 100)."
          example: 2
    DeviceSettingsOverwrite:
      type: object
      description: |
        Device settings for this test. Every field is optional. A field you set applies to this test only and takes
        precedence over the app's settings in App Storage (**App Management > Settings**); a field you leave out is not
        changed by this request.
      properties:
        lang:
          type: string
          description: "The language and region to set on the device before the test, as `language_REGION`, for example `en_GB` or `de_DE`."
          example: "en_GB"
        orientation:
          type: string
          description: "The screen orientation to set before the test. Devices default to portrait on phones and landscape on tablets."
          enum: [PORTRAIT, LANDSCAPE]
          example: "PORTRAIT"
        audio_capture:
          type: boolean
          description: "Record the device audio in the test video. Off unless you turn it on here."
          example: false
        proxy_enabled:
          type: boolean
          description: "Send the device's traffic through the HTTP proxy given in `proxy`. Off unless you turn it on here."
          example: false
        proxy:
          type: object
          description: "The HTTP proxy to use when `proxy_enabled` is `true`."
          required:
            - host
            - port
          properties:
            host:
              type: string
              description: "Proxy host name or IP address."
              example: "proxy.example.com"
            port:
              type: integer
              description: "Proxy port."
              example: 8080
    AndroidSettingsOverwrite:
      description: |
        Device and app instrumentation settings for this Espresso test — the equivalent of `appSettings` in a
        `saucectl` configuration (`instrumentation_enabled` is `appSettings.resigningEnabled` there). To use any of the
        instrumentation features — network capture, image injection, biometrics interception and the others listed
        under `instrumentation` — send `settings_overwrite` with `instrumentation_enabled: true` and the feature set to
        `true`. When you leave `settings_overwrite` out entirely, instrumentation, audio capture and the proxy are off
        for this test, even if they are switched on for the app in App Storage.
      allOf:
        - $ref: "#/components/schemas/DeviceSettingsOverwrite"
        - type: object
          properties:
            instrumentation_enabled:
              type: boolean
              description: "Let Sauce Labs instrument your app so the features under `instrumentation` work. Your APK is re-packaged and re-signed for this; the test runs against the instrumented copy."
              example: true
            instrumentation:
              type: object
              description: "The instrumentation features to turn on. Each is off unless set to `true`, and needs `instrumentation_enabled: true`."
              properties:
                image_injection:
                  type: boolean
                  description: "Let your test provide the image the camera returns, to test QR codes, document scans and similar flows."
                network_capture:
                  type: boolean
                  description: "Capture your app's network traffic as a HAR file, downloadable from the test."
                vitals:
                  type: boolean
                  description: "Record device vitals (CPU, memory, network usage) during the test."
                group_folder_redirect:
                  type: boolean
                  description: "Redirect the app's group folder so the test can read and write shared app data."
                biometrics:
                  type: boolean
                  description: "Intercept fingerprint and face authentication so your test can simulate a successful or failed scan."
                sys_alerts_delay:
                  type: boolean
                  description: "Delay system alerts such as permission dialogs so your test can handle them."
                bypass_screenshot_restriction:
                  type: boolean
                  description: "Record video and screenshots of screens your app marks as secure (`FLAG_SECURE`)."
    IosSettingsOverwrite:
      description: |
        Device and app resigning settings for this XCUITest or XCTest test — the equivalent of `appSettings` in a
        `saucectl` configuration (`resigning` here is `appSettings.instrumentation` there). Sauce Labs resigns your
        app to run it on its devices; the resigning step also enables the features listed under `resigning` — network
        capture, image injection, biometrics interception and the others. To use one, send `settings_overwrite` with
        `resigning_enabled: true` and the feature set to `true`. When you leave `settings_overwrite` out entirely, the
        app is resigned with every feature off, and audio capture and the proxy are off, even if they are switched on
        for the app in App Storage.
      allOf:
        - $ref: "#/components/schemas/DeviceSettingsOverwrite"
        - type: object
          properties:
            resigning_enabled:
              type: boolean
              description: "Resign the app with the Sauce Labs provisioning profile and inject the Sauce Labs runtime, which the features under `resigning` need. On by default. Set it to `false` only if your app must keep its own signature; it then cannot use any `resigning` feature."
              example: true
            resigning:
              type: object
              description: "The features to turn on through resigning. Each is off unless set to `true`, and needs `resigning_enabled: true`."
              properties:
                image_injection:
                  type: boolean
                  description: "Let your test provide the image the camera returns, to test QR codes, document scans and similar flows."
                network_capture:
                  type: boolean
                  description: "Capture your app's network traffic as a HAR file, downloadable from the test."
                vitals:
                  type: boolean
                  description: "Record device vitals (CPU, memory, network usage) during the test."
                group_directory:
                  type: boolean
                  description: "Redirect the app's group directory so the test can read and write shared app data."
                biometrics:
                  type: boolean
                  description: "Intercept Face ID and Touch ID so your test can simulate a successful or failed scan."
                sys_alerts_delay:
                  type: boolean
                  description: "Delay system alerts such as permission dialogs so your test can handle them."
                bypass_screenshot_restriction:
                  type: boolean
                  description: "Record video and screenshots of screens your app marks as secure."
                group_folder_redirect:
                  type: boolean
                  deprecated: true
                  description: "Accepted for backwards compatibility and ignored on iOS. Use `group_directory`."
    TestExecutionResponse:
      type: object
      required:
        - test_report
      properties:
        test_report:
          type: object
          description: "The test that was started."
          required:
            - id
            - url
          properties:
            id:
              type: string
              description: "The id of the test. Use it with the other Jobs endpoints (`/v1/rdc/jobs/{job_id}`) to read the status and result and to download the video, logs and other results."
              pattern: "^[a-f0-9]{32}$"
              example: "0123456789abcdef0123456789abcdef"
            url:
              type: string
              format: uri
              description: "The test in the Sauce Labs UI — `app.saucelabs.com` for US West, `app.eu-central-1.saucelabs.com` for EU Central, `app.us-east-4.saucelabs.com` for US East, `app.asia-south-2.saucelabs.com` for Asia South."
              example: "https://app.saucelabs.com/tests/0123456789abcdef0123456789abcdef"
      example:
        test_report:
          id: "0123456789abcdef0123456789abcdef"
          url: "https://app.saucelabs.com/tests/0123456789abcdef0123456789abcdef"
    ProblemDetail:
      type: object
      description: "Error body in the [problem details](https://www.rfc-editor.org/rfc/rfc9457) format. `detail` says what was wrong."
      properties:
        type:
          type: string
          description: "Problem type. Absent or `about:blank` for generic errors."
          example: "about:blank"
        title:
          type: string
          example: "Bad Request"
        status:
          type: integer
          example: 400
        detail:
          type: string
          description: "What was wrong with the request."
          example: "The query parameter 'state' has an invalid value: 'busy'. Allowed values are: IN_USE, AVAILABLE, REBOOTING, CLEANING, MAINTENANCE, OFFLINE."
        instance:
          type: string
          example: "/tests"
    ConstraintViolationProblem:
      type: object
      description: "Error body when one or more fields fail validation. `violations` lists each field and what is wrong with it; field names are given in camelCase (`appId` for `app_id`)."
      required:
        - type
        - violations
      properties:
        type:
          type: string
          enum: ["https://zalando.github.io/problem/constraint-violation"]
        title:
          type: string
          example: "Constraint Violation"
        status:
          type: integer
          example: 400
        instance:
          type: string
          example: "/tests"
        violations:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                description: "The field, in camelCase."
                example: "appId"
              message:
                type: string
                example: "must not be null"

    # ---------------------------------------------------------------- Private Real Device Management
    ManagedDevice:
      type: object
      description: One private device of your organization.
      properties:
        id:
          type: string
          description: "The device id."
          example: "iPhone_15_Pro_private"
        name:
          type: string
          description: "The device name shown in the Sauce Labs UI."
          example: "iPhone 15 Pro"
        os:
          type: object
          properties:
            name:
              type: string
              enum: [Android, iOS]
            version:
              type: string
              example: "18.0"
        screenSize:
          type: number
          format: double
          description: "The screen diagonal in inches."
          example: 6.1
        resolutionWidth:
          type: integer
          example: 1179
        resolutionHeight:
          type: integer
          example: 2556
        state:
          $ref: "#/components/schemas/DeviceState"
        team:
          type: string
          nullable: true
          description: "The id of the first team the device is assigned to, or `null`. Kept for compatibility; use `teams`."
          example: "8f0444d7762548bd81ae46722a14e1c6"
        teams:
          type: array
          description: "The ids of the teams the device is assigned to. Empty when the whole organization can use it."
          items:
            type: string
          example: ["8f0444d7762548bd81ae46722a14e1c6"]
        appWhitelist:
          type: array
          description: "Package names (Android) or bundle ids (iOS) of apps that stay installed, with their data, between sessions."
          items:
            type: string
          example: ["com.example.app"]
        accountWhitelist:
          type: array
          description: "Emails of the Google accounts or Apple IDs that stay signed in between sessions."
          items:
            type: string
          example: ["qa-tester@example.com"]
        systemAppAllowlist:
          type: array
          description: "Bundle ids of iOS system apps your tests may use. Always empty on Android."
          items:
            type: string
          example: ["com.apple.calculator"]
        applePaySupportEnabled:
          type: boolean
          nullable: true
          description: "Whether Apple Pay testing is enabled on this iOS device. `null` on Android."
        skipCleaningFolders:
          type: array
          description: "Folders on an Android device that are not wiped between sessions."
          items:
            type: string
          example: ["/sdcard/Download"]
    TeamsUpdateRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          description: "The ids of the teams the device belongs to. An empty list removes every assignment."
          items:
            type: string
          example: ["8f0444d7762548bd81ae46722a14e1c6"]
    DeviceSettings:
      type: object
      description: The persistence settings of a private device. Send all of them; they replace the stored settings.
      required:
        - appWhitelist
        - accountWhitelist
        - systemAppAllowlist
        - applePaySupportEnabled
        - skipCleaningFolders
      properties:
        id:
          type: string
          description: "The device id. Optional; the id in the path is used."
          example: "iPhone_15_Pro_private"
        appWhitelist:
          type: array
          description: "[Persist installed apps](https://docs.saucelabs.com/basics/acct-team-mgmt/private-device-mgmt/#app-allow-list) and their data between sessions: package names (Android) or bundle ids (iOS). At most 100 entries."
          maxItems: 100
          items:
            type: string
          example: ["com.example.app"]
        accountWhitelist:
          type: array
          description: "Preserve [store and payment account sign-ins](https://docs.saucelabs.com/basics/acct-team-mgmt/private-device-mgmt/#account-allow-list) between sessions: the email of each Google account or Apple ID. At most 100 entries."
          maxItems: 100
          items:
            type: string
          example: ["qa-tester@example.com"]
        systemAppAllowlist:
          type: array
          description: "Allow access to [iOS preinstalled apps](https://docs.saucelabs.com/basics/acct-team-mgmt/private-device-mgmt/#system-app-allow-list-ios): their bundle ids. iOS only; ignored on Android. At most 100 entries."
          maxItems: 100
          items:
            type: string
          example: ["com.apple.calculator"]
        applePaySupportEnabled:
          type: boolean
          description: "Enable [Apple Pay testing](https://docs.saucelabs.com/basics/acct-team-mgmt/private-device-mgmt/#enable-apple-pay). iOS only; ignored on Android. Contact your Sauce Labs representative or Support for the additional configuration."
          example: false
        skipCleaningFolders:
          type: array
          description: "[Retain folders](https://docs.saucelabs.com/basics/acct-team-mgmt/private-device-mgmt/#retain-foldersfilepath-android) on an Android device between sessions: absolute paths. At most 100 entries."
          maxItems: 100
          items:
            type: string
          example: ["/sdcard/Download"]
