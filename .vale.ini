StylesPath = styles

# suggestion, warning, or error
MinAlertLevel = suggestion

# Vale lints front matter values (scope frontmatter.<key>). `id` is the page's URL slug, not prose, so skip it.
# Setting IgnoredScopes replaces Vale's default list (code, tt), so those are repeated here.
IgnoredScopes = code, tt, frontmatter.id

[*.md]
BasedOnStyles = sauce
# Fenced code is skipped by Vale's Markdown parser; a BlockIgnores regex for it made Vale lint inside code blocks.
TokenIgnores = \(\/.*?\), \
               {%.*?%}, \
               {{.*?}}, \
               (.|\/|-)?github(\/|-)?, \
               (<http[^\n]+>+?), \
               (```[a-z]*[\s\S]*?\n```), \
               (\"+[^\n$]+\"+), \
               (\'+[^\n$]+\'+)
