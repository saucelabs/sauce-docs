StylesPath = styles

# suggestion, warning, or error
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = sauce
# Fenced code is skipped by Vale's Markdown parser; a BlockIgnores regex for it made Vale lint inside code blocks.
TokenIgnores = \(\/.*?\), \
               {%.*?%}, \
               {{.*?}}, \
               (.|\/|-)?github(\/|-)?, \
               (<http[^\n]+>+?), \
               (```[a-z]*[\s\S]*?\n```), \
               (\"+[^\n$]+\"+), \
               (\'+[^\n$]+\'+)
